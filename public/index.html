<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="پلتفرم NFT ایرانی برای خرید، فروش و ساخت توکن‌های غیرمثلی"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      /* استایل سفارشی برای SweetAlert2 */
      .swal2-popup {
        background-color: #1a1a2e !important;
        color: #ffffff !important;
        border-radius: 12px !important;
        border: 1px solid rgba(0, 255, 163, 0.2) !important;
        font-family: 'Vazirmatn', sans-serif !important;
      }
      
      .swal2-title, .swal2-content {
        color: #ffffff !important;
      }
      
      .swal2-confirm {
        background-color: #00ff9d !important;
        color: #1a1a2e !important;
        border-radius: 8px !important;
        font-weight: 600 !important;
        padding: 10px 24px !important;
      }
      
      .swal2-confirm:focus {
        box-shadow: 0 0 0 3px rgba(0, 255, 163, 0.3) !important;
      }
      
      .swal2-icon.swal2-success .swal2-success-ring {
        border-color: rgba(0, 255, 163, 0.3) !important;
      }
      
      .swal2-icon.swal2-success [class^='swal2-success-line'] {
        background-color: #00ff9d !important;
      }
      
      .swal2-icon.swal2-error {
        border-color: #ff3b3b !important;
      }
      
      .swal2-icon.swal2-error [class^='swal2-x-mark-line'] {
        background-color: #ff3b3b !important;
      }
      
      .swal2-icon.swal2-warning {
        border-color: #ffbb00 !important;
        color: #ffbb00 !important;
      }
      
      .swal2-icon.swal2-info {
        border-color: #3b88ff !important;
        color: #3b88ff !important;
      }
      
      .swal2-timer-progress-bar {
        background-color: rgba(0, 255, 163, 0.3) !important;
      }
    </style>
    <title>IRNFT - پلتفرم NFT ایرانی</title>
  </head>
  <body>
    <noscript>برای استفاده از این سایت باید جاوا اسکریپت را فعال کنید.</noscript>
    <div id="root"></div>
  </body>
</html>
